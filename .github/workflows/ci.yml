name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PostGIS, not plain postgres — the Region table's geometry column
    # needs the postgis extension pre-installed, same as local dev's
    # docker-compose (postgis/postgis image), or `alembic upgrade head`
    # fails on the first migration.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: trend_detective
          POSTGRES_PASSWORD: trend_detective
          POSTGRES_DB: trend_detective
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trend_detective"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://trend_detective:trend_detective@localhost:5432/trend_detective
      JWT_SECRET: ci-test-secret-not-for-production
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m app.db.seed
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # Real browser smoke test against the full running stack — tsc/build alone
  # miss real rendering bugs this app has actually shipped before (a trend
  # line rendered off-chart, a map that hung forever with zero console
  # output). See frontend/scripts/smoke-test.mjs for why this exists.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: trend_detective
          POSTGRES_PASSWORD: trend_detective
          POSTGRES_DB: trend_detective
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trend_detective"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://trend_detective:trend_detective@localhost:5432/trend_detective
      JWT_SECRET: ci-test-secret-not-for-production
      ENV: test
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Migrate and seed the database
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.db.seed
      - name: Start the backend
        working-directory: backend
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 2
          done
          echo "backend never became healthy"; cat backend/backend.log; exit 1
      - name: Seed one real finding (best-effort — smoke test skips the detail page if this doesn't finish in time)
        run: |
          curl -sf -X POST http://localhost:8000/api/investigations \
            -H "Content-Type: application/json" \
            -d '{"question":"Has temperature changed significantly in Bangladesh since 2010?"}' || true
          sleep 45

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start the frontend
        working-directory: frontend
        run: nohup npm run start > frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "frontend never came up"; cat frontend/frontend.log; exit 1
      - name: Run the browser smoke test
        working-directory: frontend
        run: node scripts/smoke-test.mjs http://localhost:3000

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "--- backend.log ---"; cat backend/backend.log || true
          echo "--- frontend.log ---"; cat frontend/frontend.log || true
