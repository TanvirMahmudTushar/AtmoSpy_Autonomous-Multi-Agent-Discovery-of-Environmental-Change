services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: trend-detective-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trend_detective
      POSTGRES_PASSWORD: trend_detective
      POSTGRES_DB: trend_detective
    ports:
      # Host port 5432 is often already bound by a local Postgres install
      # (that happened here); use 55432 on the host side to avoid clashing.
      - "55432:5432"
    volumes:
      - trend_detective_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trend_detective"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: trend-detective-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trend_detective:trend_detective@postgres:5432/trend_detective
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      # curl isn't in the python:slim base image; urllib is stdlib, so this
      # needs no extra package just to answer "is the API up".
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s # first boot runs `alembic upgrade head` + seed before serving

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle — must be an address the *browser*
        # (running on the host, not in the Compose network) can reach.
        # Override via .env (e.g. your LAN IP) to reach it from other devices.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: trend-detective-web
    restart: unless-stopped
    environment:
      # Server-side rendering (generateMetadata, the OG image route) runs
      # inside this container, where "localhost" means the frontend
      # container itself — it needs the Compose service name instead.
      INTERNAL_API_URL: http://backend:8000
    ports:
      # Overridable — port 3000 is a very common default to already have
      # something else bound to locally (dev servers, other frontend
      # projects, etc). `FRONTEND_PORT=3002 docker compose up` to change it.
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  trend_detective_pgdata:
